{% extends "base.html" %}
{% block title %}Passwort ändern{% endblock %}
{% block content %}
<div class="card login">
  <h1>Passwort ändern</h1>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="primary">Ändern</button></form>
  <p class="muted">Mindestens 12 Zeichen, keine häufigen oder rein numerischen Passwörter.</p>
</div>
{% endblock %}
