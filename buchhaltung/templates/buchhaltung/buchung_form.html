{% extends "base.html" %}
{% block title %}Neue Buchung{% endblock %}
{% block content %}
<div class="card">
  <h1>Neue Buchung</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ form.as_p }}
    <button class="primary">Buchen</button>
  </form>
  <p class="muted">Buchungen sind danach unveränderlich. Korrekturen erfolgen per Stornobuchung.</p>
</div>
{% endblock %}
