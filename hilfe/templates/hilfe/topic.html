{% extends "base.html" %}
{% block title %}Hilfe: {{ topic.title }}{% endblock %}
{% block content %}
<style>
  .help { display: flex; gap: 16px; align-items: flex-start; }
  .help nav { flex: 0 0 210px; font-size: 14px; }
  .help nav a { display: block; padding: 4px 8px; border-radius: 6px; text-decoration: none; color: #1c2430; }
  .help nav a.current { background: #e6edf7; font-weight: 600; }
  .help article { flex: 1; min-width: 0; }
  .help article h2 { margin-top: 24px; }
  .help .tip { background: #eef6ee; border-left: 4px solid #3a8a4a; padding: 8px 12px; margin: 12px 0; }
  .help .warn { background: #fdf3e6; border-left: 4px solid #c77b13; padding: 8px 12px; margin: 12px 0; }
  .help dt { font-weight: 600; margin-top: 10px; }
  @media (max-width: 700px) { .help { flex-direction: column; } .help nav { flex: none; width: 100%; } }
</style>
<div class="help">
  <nav class="card" aria-label="Hilfethemen">
    <a href="{% url 'hilfe_index' %}">&larr; Übersicht und Suche</a>
    {% for t in topics %}<a href="{% url 'hilfe_topic' t.slug %}"{% if t.slug == topic.slug %} class="current" aria-current="page"{% endif %}>{{ t.title }}</a>{% endfor %}
  </nav>
  <article class="card">
    <h1>{{ topic.title }}</h1>
    {% include "hilfe/topics/"|add:topic.slug|add:".html" %}
  </article>
</div>
{% endblock %}
